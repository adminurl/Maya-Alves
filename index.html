<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Alves</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a96e;
            --gold-light: #e8d5a8;
            --dark: #0a0a0a;
            --darker: #050505;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--darker);
            color: #fff;
            overflow-x: hidden;
            cursor: default;
        }

        /* Custom cursor */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.15s ease, opacity 0.15s ease;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            width: 5px;
            height: 5px;
            background: var(--gold);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10001;
        }

        .cursor.hover {
            transform: scale(2.5);
            background: rgba(201, 169, 110, 0.1);
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: float-particle 8s infinite ease-in-out;
        }

        @keyframes float-particle {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0); }
            20% { opacity: 0.6; }
            50% { opacity: 0.3; transform: translateY(-200px) scale(1); }
            80% { opacity: 0; }
            100% { transform: translateY(-400px) scale(0); }
        }

        /* Preloader */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--darker);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--gold);
            letter-spacing: 0.3em;
            animation: pulse-gold 2s infinite;
        }

        .preloader-line {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin-top: 20px;
            animation: expand 1.5s infinite;
        }

        @keyframes pulse-gold {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes expand {
            0%, 100% { transform: scaleX(0.5); }
            50% { transform: scaleX(1.5); }
        }

        /* Hero */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(5,5,5,0.6) 0%,
                rgba(5,5,5,0.3) 30%,
                rgba(5,5,5,0.2) 50%,
                rgba(5,5,5,0.5) 80%,
                rgba(5,5,5,0.85) 100%
            );
            z-index: 1;
        }

        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
            filter: brightness(0.6) contrast(1.1);
            transform: scale(1.1);
            transition: transform 10s ease;
        }

        .hero:hover .hero-bg img {
            transform: scale(1.0);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
            margin-top: -10vh;
        }

        .hero-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            line-height: 1;
            color: var(--gold-light);
            text-shadow: 0 2px 40px rgba(0,0,0,0.9), 0 0 80px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(60px);
            animation: reveal-up 1.2s ease forwards 0.5s;
        }

        .hero-tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 300;
            letter-spacing: 0.5em;
            color: var(--gold);
            margin-top: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: reveal-up 1s ease forwards 1s;
        }

        .hero-line {
            width: 80px;
            height: 1px;
            background: var(--gold);
            margin: 30px auto;
            opacity: 0;
            animation: reveal-up 1s ease forwards 1.3s;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: reveal-up 1s ease forwards 1.8s;
        }

        .scroll-indicator span {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--gold);
            text-transform: uppercase;
        }

        .scroll-arrow {
            width: 1px;
            height: 40px;
            background: var(--gold);
            position: relative;
            animation: scroll-bounce 2s infinite;
        }

        @keyframes scroll-bounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(10px); opacity: 0.3; }
        }

        @keyframes reveal-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Gallery Section */
        .gallery-section {
            padding: 100px 0;
            position: relative;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 3rem);
            text-align: center;
            margin-bottom: 60px;
            color: var(--gold-light);
            letter-spacing: 0.1em;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease;
        }

        .section-title.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gallery-item.visible {
            opacity: 1;
            transform: scale(1);
        }

        .gallery-item:nth-child(1) { grid-row: span 2; }
        .gallery-item:nth-child(4) { grid-column: span 2; aspect-ratio: 3/2; }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
            filter: grayscale(30%) brightness(0.85);
        }

        .gallery-item:hover img {
            transform: scale(1.08);
            filter: grayscale(0%) brightness(1);
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.6) 100%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        /* CTA Section */
        .cta-section {
            padding: 120px 20px;
            position: relative;
            overflow: hidden;
        }

        .cta-bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.08;
            pointer-events: none;
        }

        .cta-bg-glow.left {
            background: var(--gold);
            top: -200px;
            left: -200px;
        }

        .cta-bg-glow.right {
            background: #a855f7;
            bottom: -200px;
            right: -200px;
        }

        .cta-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            position: relative;
            z-index: 2;
        }

        .cta-card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            height: 500px;
            opacity: 0;
            transform: translateY(60px) scale(1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            text-decoration: none;
        }

        .cta-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .cta-card.visible:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 60px rgba(201, 169, 110, 0.2), 0 0 80px rgba(201, 169, 110, 0.08);
        }

        .cta-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(201, 169, 110, 0.2);
            border-radius: 24px;
            z-index: 3;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .cta-card:hover::before {
            border-color: var(--gold);
            box-shadow: inset 0 0 30px rgba(201, 169, 110, 0.1);
        }

        .cta-card-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .cta-card-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
            filter: brightness(0.5) saturate(0.8);
        }

        .cta-card:hover .cta-card-bg img {
            transform: scale(1.08);
            filter: brightness(0.65) saturate(1);
        }

        .cta-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                rgba(5,5,5,0.2) 0%,
                rgba(5,5,5,0.5) 50%,
                rgba(5,5,5,0.9) 100%
            );
            z-index: 1;
        }

        .cta-card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px;
            z-index: 2;
            text-align: center;
        }

        .cta-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
            transition: transform 0.5s ease;
        }

        .cta-card:hover .cta-icon {
            transform: scale(1.3) translateY(-8px);
        }

        .cta-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.3rem, 3vw, 2rem);
            color: var(--gold-light);
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            transition: text-shadow 0.5s ease, transform 0.5s ease;
        }

        .cta-card:hover .cta-title {
            text-shadow: 0 0 20px rgba(201, 169, 110, 0.6);
            transform: scale(1.05);
        }

        .cta-desc {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .cta-btn {
            display: inline-block;
            padding: 14px 40px;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201,169,110,0.2), transparent);
            transition: left 0.5s ease;
        }

        .cta-btn:hover::before {
            left: 100%;
        }

        .cta-btn:hover {
            background: var(--gold);
            color: var(--dark);
            box-shadow: 0 0 30px rgba(201, 169, 110, 0.3);
            transform: scale(1.08);
        }

        .cta-card .cta-btn {
            animation: btn-pulse 2.5s ease-in-out infinite;
        }

        .cta-card:hover .cta-btn {
            animation: none;
            background: var(--gold);
            color: var(--dark);
            box-shadow: 0 0 40px rgba(201, 169, 110, 0.4);
        }

        @keyframes btn-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(201, 169, 110, 0.3); }
            50% { box-shadow: 0 0 20px 5px rgba(201, 169, 110, 0.15); }
        }

        /* Floating photos */
        .floating-photos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-photo {
            position: absolute;
            border-radius: 12px;
            overflow: hidden;
            opacity: 0.04;
            filter: blur(1px);
        }

        .floating-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Magnetic effect */
        .magnetic {
            transition: transform 0.3s ease;
        }

        /* Photo strip */
        .photo-strip {
            overflow: hidden;
            padding: 60px 0;
            position: relative;
        }

        .photo-strip::before,
        .photo-strip::after {
            content: '';
            position: absolute;
            top: 0;
            width: 200px;
            height: 100%;
            z-index: 2;
        }

        .photo-strip::before {
            left: 0;
            background: linear-gradient(90deg, var(--darker), transparent);
        }

        .photo-strip::after {
            right: 0;
            background: linear-gradient(-90deg, var(--darker), transparent);
        }

        .strip-track {
            display: flex;
            gap: 20px;
            animation: scroll-strip 30s linear infinite;
            width: max-content;
        }

        .strip-track:hover {
            animation-play-state: paused;
        }

        .strip-item {
            width: 250px;
            height: 350px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .strip-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
            filter: grayscale(20%);
        }

        .strip-item:hover img {
            transform: scale(1.1);
            filter: grayscale(0%);
        }

        @keyframes scroll-strip {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 0;
        }

        .divider-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .divider-diamond {
            width: 8px;
            height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(201, 169, 110, 0.1);
        }

        footer p {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.2em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cta-container {
                grid-template-columns: 1fr;
                padding: 0 20px;
            }

            .cta-card {
                height: 400px;
            }

            .gallery-grid {
                grid-template-columns: 1fr 1fr;
            }

            .gallery-item:nth-child(1) { grid-row: span 1; }
            .gallery-item:nth-child(4) { grid-column: span 1; aspect-ratio: 3/4; }

            .strip-item {
                width: 180px;
                height: 250px;
            }

            .cursor, .cursor-dot {
                display: none;
            }
        }

        /* Reveal animation classes */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Shimmer effect on gold text */
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .shimmer {
            background-size: 200% auto;
            animation: shimmer 4s linear infinite;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox.active img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--gold);
            cursor: pointer;
            border: 1px solid rgba(201,169,110,0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .lightbox-close:hover {
            background: var(--gold);
            color: var(--dark);
        }
    </style>
</head>

            <div class="strip-item"><img src="images/sunset.jpg" alt=""></div>
            <div class="strip-item"><img src="images/fireplace2.jpg" alt=""></div>
            <div class="strip-item"><img src="images/selfie-blue.jpg" alt=""></div>
            <div class="strip-item"><img src="images/golden.jpg" alt=""></div>
            <div class="strip-item"><img src="images/sunset2.jpg" alt=""></div>
            <!-- Duplicated for seamless loop -->
            <div class="strip-item"><img src="images/hero.jpg" alt=""></div>
            <div class="strip-item"><img src="images/selfie-grey.jpg" alt=""></div>
            <div class="strip-item"><img src="images/portrait1.jpg" alt=""></div>
            <div class="strip-item"><img src="images/closeup.jpg" alt=""></div>
            <div class="strip-item"><img src="images/selfie-sport.jpg" alt=""></div>
            <div class="strip-item"><img src="images/sunset.jpg" alt=""></div>
            <div class="strip-item"><img src="images/fireplace2.jpg" alt=""></div>
            <div class="strip-item"><img src="images/selfie-blue.jpg" alt=""></div>
            <div class="strip-item"><img src="images/golden.jpg" alt=""></div>
            <div class="strip-item"><img src="images/sunset2.jpg" alt=""></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="divider" style="padding-bottom: 30px;">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line"></div>
        </div>
        <p>MAYA ALVES &mdash; 2026</p>
    </footer>

    <script>
        // Preloader
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hidden');
            }, 1500);
        });

        // Custom cursor
        const cursor = document.getElementById('cursor');
        const cursorDot = document.getElementById('cursorDot');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
            cursorDot.style.left = e.clientX - 2.5 + 'px';
            cursorDot.style.top = e.clientY - 2.5 + 'px';
        });

        document.querySelectorAll('a, .cta-card, .gallery-item, .strip-item, .cta-btn').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (6 + Math.random() * 6) + 's';
            particle.style.width = (2 + Math.random() * 3) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // Parallax on hero
        const heroBgImg = document.getElementById('heroBgImg');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const heroH = document.getElementById('hero').offsetHeight;
            if (scrollY < heroH) {
                heroBgImg.style.transform = `scale(1.1) translateY(${scrollY * 0.3}px)`;
            }
        });

        // Reveal on scroll (Intersection Observer)
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 100);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // Magnetic effect on CTA cards
        document.querySelectorAll('.magnetic').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                card.style.transform = `translateY(0) perspective(1000px) rotateX(${-y / 30}deg) rotateY(${x / 30}deg)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0) perspective(1000px) rotateX(0) rotateY(0)';
            });
        });

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        document.querySelectorAll('[data-lightbox]').forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') lightbox.classList.remove('active');
        });

        // Smooth scroll with easing
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
            });
        });

        // Mouse trail sparkle
        let lastSparkle = 0;
        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastSparkle < 80) return;
            lastSparkle = now;

            const sparkle = document.createElement('div');
            sparkle.style.cssText = `
                position: fixed;
                left: ${e.clientX}px;
                top: ${e.clientY}px;
                width: 3px;
                height: 3px;
                background: ${Math.random() > 0.5 ? 'var(--gold)' : 'var(--gold-light)'};
                border-radius: 50%;
                pointer-events: none;
                z-index: 9998;
                animation: sparkle-fade 0.8s ease forwards;
            `;
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
        });

        const sparkleStyle = document.createElement('style');
        sparkleStyle.textContent = `
            @keyframes sparkle-fade {
                0% { opacity: 0.8; transform: scale(1); }
                100% { opacity: 0; transform: scale(0) translateY(-20px); }
            }
        `;
        document.head.appendChild(sparkleStyle);
    </script>
</body>
</html>
